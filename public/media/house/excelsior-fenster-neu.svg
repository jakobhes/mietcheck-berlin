  <rect x="70" y="30" width="180" height="160" fill="#eaf2fb" stroke="#334" stroke-width="5"/>
  <line x1="160" y1="30" x2="160" y2="190" stroke="#334" stroke-width="5"/>
  <!-- Öffnungsdreiecke: Spitze zeigt zur Griffseite, Scharniere außen -->
