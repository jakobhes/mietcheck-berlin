  <path d="M60 110 q-30 -20 -40 -45" fill="none" stroke="#2b7bd6" stroke-width="3"/>
  <path d="M20 65 l-2 14 m2 -14 l12 6" stroke="#2b7bd6" stroke-width="3" fill="none"/>
  <path d="M260 110 q30 -20 40 -45" fill="none" stroke="#2b7bd6" stroke-width="3"/>
  <path d="M300 65 l2 14 m-2 -14 l-12 6" stroke="#2b7bd6" stroke-width="3" fill="none"/>
  <text x="160" y="222" text-anchor="middle" font-size="15" fill="#667">Platzhalter – Foto folgt</text>
