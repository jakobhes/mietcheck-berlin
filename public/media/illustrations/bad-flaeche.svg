<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" font-family="system-ui,sans-serif">
  <rect width="400" height="220" fill="#fff"/>
  <!-- kleines Bad -->
  <g transform="translate(20,30)">
    <rect width="120" height="150" fill="#fdf1ec" stroke="#b3401f" stroke-width="3"/>
    <rect x="8" y="8" width="44" height="100" rx="18" fill="#fff" stroke="#555" stroke-width="2"/>
    <ellipse cx="96" cy="30" rx="16" ry="12" fill="#fff" stroke="#555" stroke-width="2"/>
    <rect x="80" y="110" width="30" height="34" rx="12" fill="#fff" stroke="#555" stroke-width="2"/>
    <text x="60" y="-8" text-anchor="middle" font-size="18" font-weight="700" fill="#b3401f">&lt; 4 m²</text>
    <text x="60" y="172" text-anchor="middle" font-size="13" fill="#555">z. B. 1,6 × 2,2 m</text>
  </g>
  <!-- großes Bad -->
  <g transform="translate(180,30)">
    <rect width="200" height="150" fill="#edf8f1" stroke="#1e7a46" stroke-width="3"/>
    <rect x="8" y="8" width="110" height="46" rx="18" fill="#fff" stroke="#555" stroke-width="2"/>
    <rect x="140" y="8" width="52" height="52" fill="#fff" stroke="#555" stroke-width="2"/>
    <circle cx="166" cy="34" r="5" fill="#555"/>
    <ellipse cx="40" cy="128" rx="16" ry="12" fill="#fff" stroke="#555" stroke-width="2"/>
    <ellipse cx="80" cy="128" rx="16" ry="12" fill="#fff" stroke="#555" stroke-width="2"/>
    <rect x="150" y="100" width="30" height="40" rx="12" fill="#fff" stroke="#555" stroke-width="2"/>
    <text x="100" y="-8" text-anchor="middle" font-size="18" font-weight="700" fill="#1e7a46">&gt; 8 m²</text>
    <text x="100" y="172" text-anchor="middle" font-size="13" fill="#555">z. B. 2,9 × 2,9 m</text>
  </g>
</svg>
